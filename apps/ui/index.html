<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filegate upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1012;
        --panel: rgba(23, 24, 28, 0.87);
        --panel-soft: rgba(255, 255, 255, 0.05);
        --text: #f7f5ef;
        --muted: #a6a39a;
        --accent: #f3b23c;
        --accent-2: #7fd6ff;
        --pending: #f3b23c;
        --picked: #76d18b;
        --archived: #8d8d8d;
        --danger: #ff6f7f;
        --border: rgba(255, 255, 255, 0.15);
        --shadow: 0 28px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: radial-gradient(circle at 85% 12%, #223344 0%, transparent 36%),
          radial-gradient(circle at 12% 84%, #402a17 0%, transparent 33%), var(--bg);
        font-family: 'Bricolage Grotesque', sans-serif;
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image: radial-gradient(rgba(255, 255, 255, 0.15) 0.5px, transparent 0.5px);
        background-size: 4px 4px;
        mix-blend-mode: overlay;
      }

      .app-shell {
        width: min(1180px, 100% - 2rem);
        margin: 1.5rem auto;
        display: grid;
        gap: 1rem;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.2rem;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2.3vw, 1.9rem);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .brand small {
        font-family: 'IBM Plex Mono', monospace;
        color: var(--muted);
      }

      .btn,
      button,
      input,
      .input {
        font: inherit;
      }

      .btn {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        cursor: pointer;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .btn.primary {
        border-color: rgba(243, 178, 60, 0.7);
        background: rgba(243, 178, 60, 0.18);
      }

      .btn.danger {
        border-color: rgba(255, 111, 127, 0.7);
        background: rgba(255, 111, 127, 0.18);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 1rem;
      }

      .upload-panel {
        padding: 1rem;
      }

      .dropzone {
        min-height: 56vh;
        border: 1px dashed rgba(243, 178, 60, 0.6);
        border-radius: 16px;
        padding: 1.2rem;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(165deg, rgba(0, 0, 0, 0.18), rgba(243, 178, 60, 0.08));
        transition: transform 160ms ease, border-color 160ms ease, background 220ms ease;
      }

      .dropzone.active {
        transform: scale(1.01);
        border-color: rgba(127, 214, 255, 0.8);
        background: linear-gradient(165deg, rgba(0, 0, 0, 0.12), rgba(127, 214, 255, 0.12));
      }

      .dropzone h2 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.4rem);
      }

      .dropzone p {
        margin: 0.2rem 0 0;
        color: var(--muted);
      }

      .dropzone-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 0.9rem;
      }

      .meta-line {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .label-row {
        display: flex;
        gap: 0.6rem;
        margin: 0.9rem 0;
      }

      .input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 0.62rem 0.75rem;
      }

      .file-list {
        margin-top: 0.8rem;
        display: grid;
        gap: 0.55rem;
      }

      .file-item {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 0.5rem;
        background: rgba(255, 255, 255, 0.03);
      }

      .file-head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.9rem;
      }

      .file-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .progress {
        width: 100%;
        height: 7px;
        background: rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        margin-top: 0.45rem;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 120ms linear;
      }

      .summary {
        margin-top: 0.8rem;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .sessions-panel {
        padding: 1rem;
      }

      .sessions-panel h3 {
        margin: 0 0 0.8rem;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
      }

      .session-list {
        display: grid;
        gap: 0.55rem;
      }

      .session-row {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 0.6rem;
        background: rgba(255, 255, 255, 0.04);
        display: grid;
        gap: 0.45rem;
      }

      .session-main {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }

      .session-id {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.83rem;
      }

      .status {
        font-size: 0.78rem;
        border-radius: 999px;
        padding: 0.22rem 0.52rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .status.pending {
        color: var(--pending);
        border-color: rgba(243, 178, 60, 0.45);
      }

      .status.picked {
        color: var(--picked);
        border-color: rgba(118, 209, 139, 0.45);
      }

      .status.archived {
        color: var(--archived);
      }

      .session-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .session-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.45rem;
      }

      .confirm-card {
        margin-top: 0.8rem;
        padding: 0.8rem;
        border-radius: 12px;
        border: 1px solid rgba(118, 209, 139, 0.5);
        background: rgba(118, 209, 139, 0.1);
        display: none;
      }

      .confirm-card.active {
        display: block;
        animation: rise 220ms ease;
      }

      .confirm-card p {
        margin: 0.2rem 0;
      }

      .confirm-actions {
        margin-top: 0.65rem;
        display: flex;
        gap: 0.6rem;
      }

      .auth-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        z-index: 10;
      }

      .auth-card {
        width: min(460px, calc(100% - 2rem));
        padding: 1.15rem;
      }

      .auth-card h2 {
        margin: 0 0 0.3rem;
      }

      .auth-card p {
        margin: 0 0 0.75rem;
        color: var(--muted);
      }

      .hidden {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        padding: 0.6rem 0.85rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(12, 13, 16, 0.95);
        font-size: 0.85rem;
        opacity: 0;
        transform: translateY(10px);
        transition: all 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .dropzone {
          min-height: 46vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>

    <section id="auth-screen" class="auth-screen">
      <div class="auth-card panel">
        <h2>Access token</h2>
        <p>Enter your Filegate API token to continue.</p>
        <form id="auth-form">
          <input
            id="auth-token"
            class="input"
            type="password"
            autocomplete="off"
            placeholder="sk_xxxxx"
            required
          />
          <div class="dropzone-actions" style="margin-top: 0.75rem">
            <button class="btn primary" type="submit">Save token</button>
          </div>
        </form>
      </div>
    </section>

    <main id="app" class="app-shell hidden">
      <header class="topbar panel">
        <div class="brand">
          <h1>filegate</h1>
          <small>upload station</small>
        </div>
        <div class="dropzone-actions">
          <button class="btn" id="refresh-sessions" type="button">Refresh</button>
          <button class="btn danger" id="logout" type="button">Logout</button>
        </div>
      </header>

      <section class="layout">
        <article class="upload-panel panel">
          <div id="dropzone" class="dropzone">
            <div>
              <h2>Drop files to create a session</h2>
              <p>Any file type is accepted. Upload progress is tracked in real time.</p>

              <div class="label-row">
                <input
                  id="session-label"
                  class="input"
                  type="text"
                  placeholder="Optional label (e.g. Libraries Q1 2025)"
                />
              </div>

              <div class="dropzone-actions">
                <button id="select-files" class="btn" type="button">Choose files</button>
                <button id="start-upload" class="btn primary" type="button">Create session + upload</button>
                <input id="file-input" type="file" multiple accept="*/*" class="hidden" />
              </div>
            </div>

            <div>
              <div class="meta-line" id="selection-meta">0 files selected</div>
              <div class="progress" style="margin-top: 0.4rem"><span id="global-progress"></span></div>
              <div class="summary" id="summary-text">Waiting for files...</div>
            </div>
          </div>

          <div class="file-list" id="file-list"></div>

          <div id="confirm-card" class="confirm-card">
            <p><strong>Session created:</strong> <span id="confirm-session-id"></span></p>
            <p><strong>Files uploaded:</strong> <span id="confirm-files"></span></p>
            <div class="confirm-actions">
              <button id="copy-session" type="button" class="btn">Copy ID</button>
              <button id="more-files" type="button" class="btn">Add more files</button>
            </div>
          </div>
        </article>

        <aside class="sessions-panel panel">
          <h3>SESSIONS</h3>
          <div id="session-list" class="session-list"></div>
        </aside>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script>
      const STORAGE_TOKEN_KEY = 'filegate_ui_token';
      const API_BASE = '/api';

      const state = {
        token: '',
        files: [],
        progressByName: new Map(),
        uploadSessionId: null,
      };

      const authScreen = document.getElementById('auth-screen');
      const authForm = document.getElementById('auth-form');
      const authToken = document.getElementById('auth-token');
      const app = document.getElementById('app');
      const logoutButton = document.getElementById('logout');
      const refreshSessionsButton = document.getElementById('refresh-sessions');

      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const selectFilesButton = document.getElementById('select-files');
      const startUploadButton = document.getElementById('start-upload');
      const fileList = document.getElementById('file-list');
      const selectionMeta = document.getElementById('selection-meta');
      const sessionLabelInput = document.getElementById('session-label');
      const summaryText = document.getElementById('summary-text');
      const globalProgress = document.getElementById('global-progress');

      const sessionList = document.getElementById('session-list');
      const confirmCard = document.getElementById('confirm-card');
      const confirmSessionId = document.getElementById('confirm-session-id');
      const confirmFiles = document.getElementById('confirm-files');
      const copySessionButton = document.getElementById('copy-session');
      const moreFilesButton = document.getElementById('more-files');

      const toast = document.getElementById('toast');

      let refreshTimer = null;

      function showToast(text, error = false) {
        toast.textContent = text;
        toast.style.borderColor = error ? 'rgba(255, 111, 127, 0.65)' : 'var(--border)';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        const units = ['KB', 'MB', 'GB'];
        let value = bytes / 1024;
        let unit = units[0];
        for (let i = 1; i < units.length && value >= 1024; i += 1) {
          value /= 1024;
          unit = units[i];
        }
        return `${value.toFixed(1)} ${unit}`;
      }

      function toAuthMode(message) {
        state.token = '';
        localStorage.removeItem(STORAGE_TOKEN_KEY);
        app.classList.add('hidden');
        authScreen.classList.remove('hidden');
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
        if (message) {
          showToast(message, true);
        }
      }

      function toAppMode(token) {
        state.token = token;
        localStorage.setItem(STORAGE_TOKEN_KEY, token);
        authScreen.classList.add('hidden');
        app.classList.remove('hidden');
        refreshSessions();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(refreshSessions, 30_000);
      }

      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (state.token) {
          headers.set('Authorization', `Bearer ${state.token}`);
        }

        const response = await fetch(`${API_BASE}${path}`, { ...options, headers });

        if (response.status === 401) {
          toAuthMode('Token invalid or expired.');
          throw new Error('Unauthorized');
        }

        if (!response.ok) {
          let message = `Request failed (${response.status})`;
          try {
            const payload = await response.json();
            if (payload && payload.error) {
              message = payload.error;
            }
          } catch {
            // no-op
          }
          throw new Error(message);
        }

        return response;
      }

      function setFiles(files) {
        state.files = Array.from(files);
        state.progressByName.clear();
        renderFiles();
      }

      function renderFiles() {
        fileList.innerHTML = '';

        if (state.files.length === 0) {
          selectionMeta.textContent = '0 files selected';
          summaryText.textContent = 'Waiting for files...';
          globalProgress.style.width = '0%';
          return;
        }

        const totalBytes = state.files.reduce((sum, file) => sum + file.size, 0);
        selectionMeta.textContent = `${state.files.length} files selected (${formatBytes(totalBytes)})`;

        for (const file of state.files) {
          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `
            <div class="file-head">
              <span class="file-name">${file.name}</span>
              <span>${formatBytes(file.size)}</span>
            </div>
            <div class="progress"><span id="progress-${cssSafe(file.name)}"></span></div>
          `;
          fileList.appendChild(item);
        }
      }

      function cssSafe(text) {
        return text.replace(/[^a-zA-Z0-9_-]/g, '_');
      }

      function updateGlobalProgress() {
        if (state.files.length === 0) {
          globalProgress.style.width = '0%';
          return;
        }

        const total = state.files.reduce((sum, file) => sum + file.size, 0);
        const loaded = state.files.reduce((sum, file) => {
          const value = state.progressByName.get(file.name) || 0;
          return sum + Math.min(value, file.size);
        }, 0);

        const percent = total > 0 ? (loaded / total) * 100 : 0;
        globalProgress.style.width = `${percent.toFixed(1)}%`;
        summaryText.textContent = `${loaded > 0 ? 'Uploading' : 'Ready'} ${formatBytes(loaded)} / ${formatBytes(total)}`;
      }

      function setFileProgress(file, loaded) {
        state.progressByName.set(file.name, loaded);
        const element = document.getElementById(`progress-${cssSafe(file.name)}`);
        const percent = file.size > 0 ? (Math.min(loaded, file.size) / file.size) * 100 : 0;
        if (element) element.style.width = `${percent.toFixed(1)}%`;
        updateGlobalProgress();
      }

      function uploadFile(sessionId, file) {
        return new Promise((resolve, reject) => {
          const form = new FormData();
          form.append('files', file);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${API_BASE}/sessions/${encodeURIComponent(sessionId)}/files`, true);
          xhr.setRequestHeader('Authorization', `Bearer ${state.token}`);

          xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) {
              setFileProgress(file, event.loaded);
            }
          };

          xhr.onload = () => {
            if (xhr.status === 401) {
              toAuthMode('Token invalid or expired.');
              reject(new Error('Unauthorized'));
              return;
            }

            if (xhr.status >= 200 && xhr.status < 300) {
              setFileProgress(file, file.size);
              resolve();
              return;
            }

            let message = `Upload failed (${xhr.status})`;
            try {
              const body = JSON.parse(xhr.responseText);
              if (body && body.error) {
                message = body.error;
              }
            } catch {
              // no-op
            }
            reject(new Error(message));
          };

          xhr.onerror = () => reject(new Error('Network error while uploading.'));
          xhr.send(form);
        });
      }

      async function createSession(label) {
        const response = await api('/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label }),
        });

        return response.json();
      }

      async function startUpload() {
        if (state.files.length === 0) {
          showToast('Add files before uploading.', true);
          return;
        }

        startUploadButton.disabled = true;
        confirmCard.classList.remove('active');

        try {
          const label = sessionLabelInput.value.trim() || undefined;
          const session = await createSession(label);
          state.uploadSessionId = session.id;

          for (const file of state.files) {
            await uploadFile(session.id, file);
          }

          confirmSessionId.textContent = session.id;
          const totalSize = state.files.reduce((sum, file) => sum + file.size, 0);
          confirmFiles.textContent = `${state.files.length} files (${formatBytes(totalSize)})`;
          confirmCard.classList.add('active');
          showToast(`Upload completed for ${session.id}`);

          await refreshSessions();
        } catch (error) {
          showToast(error instanceof Error ? error.message : String(error), true);
        } finally {
          startUploadButton.disabled = false;
        }
      }

      async function refreshSessions() {
        try {
          const response = await api('/sessions');
          const sessions = await response.json();
          renderSessions(sessions);
        } catch (error) {
          if (String(error) !== 'Error: Unauthorized') {
            showToast(error instanceof Error ? error.message : String(error), true);
          }
        }
      }

      function renderSessions(sessions) {
        sessionList.innerHTML = '';

        if (!Array.isArray(sessions) || sessions.length === 0) {
          sessionList.innerHTML = '<p class="meta-line">No sessions yet.</p>';
          return;
        }

        for (const session of sessions) {
          const row = document.createElement('article');
          row.className = 'session-row';

          const created = String(session.created || '').slice(0, 19).replace('T', ' ');
          const label = session.label || 'Unlabeled';

          row.innerHTML = `
            <div class="session-main">
              <div>
                <div class="session-id">${session.id}</div>
                <div>${label}</div>
              </div>
              <span class="status ${session.status}">${session.status}</span>
            </div>
            <div class="session-meta">
              <span>${session.files.length} files</span>
              <span>${created}</span>
            </div>
            <div class="session-actions">
              <button class="btn" type="button" data-copy-id="${session.id}">Copy ID</button>
            </div>
          `;

          sessionList.appendChild(row);
        }

        sessionList.querySelectorAll('[data-copy-id]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-copy-id');
            if (!id) return;
            await navigator.clipboard.writeText(id);
            showToast(`Copied ${id}`);
          });
        });
      }

      function registerDropzone() {
        ['dragenter', 'dragover'].forEach((eventName) => {
          dropzone.addEventListener(eventName, (event) => {
            event.preventDefault();
            dropzone.classList.add('active');
          });
        });

        ['dragleave', 'drop'].forEach((eventName) => {
          dropzone.addEventListener(eventName, (event) => {
            event.preventDefault();
            if (eventName === 'drop') {
              const files = event.dataTransfer?.files || [];
              setFiles(files);
            }
            dropzone.classList.remove('active');
          });
        });
      }

      authForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const token = authToken.value.trim();
        if (!token) {
          showToast('Token is required.', true);
          return;
        }
        toAppMode(token);
        authToken.value = '';
      });

      logoutButton.addEventListener('click', () => toAuthMode());
      refreshSessionsButton.addEventListener('click', refreshSessions);

      selectFilesButton.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (event) => {
        const files = event.target.files || [];
        setFiles(files);
      });
      startUploadButton.addEventListener('click', startUpload);

      copySessionButton.addEventListener('click', async () => {
        if (!state.uploadSessionId) return;
        await navigator.clipboard.writeText(state.uploadSessionId);
        showToast(`Copied ${state.uploadSessionId}`);
      });

      moreFilesButton.addEventListener('click', () => {
        state.uploadSessionId = null;
        confirmCard.classList.remove('active');
        setFiles([]);
        fileInput.value = '';
        sessionLabelInput.value = '';
      });

      registerDropzone();

      const token = localStorage.getItem(STORAGE_TOKEN_KEY);
      if (token) {
        toAppMode(token);
      } else {
        toAuthMode();
      }
    </script>
  </body>
</html>
