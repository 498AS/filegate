<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filegate upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0b;
        --surface: #111113;
        --surface-raised: #191a1c;
        --text: #ededef;
        --text-secondary: #8b8b8e;
        --text-tertiary: #5c5c5f;
        --accent: #7b61ff;
        --accent-muted: rgba(123, 97, 255, 0.15);
        --pending: #e5a63b;
        --picked: #3fb950;
        --archived: #6e6e73;
        --danger: #f85149;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.14);
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .grain { display: none; }

      .app-shell {
        width: min(1120px, 100% - 2rem);
        margin: 0 auto;
        display: grid;
        gap: 1px;
      }

      .panel {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        height: 48px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand small {
        font-size: 12px;
        color: var(--text-tertiary);
        font-weight: 400;
      }

      .btn,
      button,
      input,
      .input {
        font: inherit;
      }

      .btn {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 5px 12px;
        background: var(--surface-raised);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: color 100ms, background 100ms, border-color 100ms;
      }

      .btn:hover {
        color: var(--text);
        border-color: var(--border-hover);
        background: rgba(255, 255, 255, 0.06);
      }

      .btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .btn.primary:hover {
        opacity: 0.9;
      }

      .btn.danger {
        color: var(--danger);
        border-color: rgba(248, 81, 73, 0.3);
        background: transparent;
      }

      .btn.danger:hover {
        background: rgba(248, 81, 73, 0.1);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 380px;
        min-height: calc(100vh - 48px);
      }

      .upload-panel {
        padding: 24px;
        background: var(--bg);
      }

      .dropzone {
        min-height: 320px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--surface);
        transition: border-color 120ms;
      }

      .dropzone.active {
        border-color: var(--accent);
      }

      .dropzone h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .dropzone p {
        margin: 6px 0 0;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      .dropzone-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .meta-line {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--text-tertiary);
      }

      .label-row {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }

      .input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--text);
        padding: 7px 10px;
        font-size: 13px;
        outline: none;
        transition: border-color 100ms;
      }

      .input:focus {
        border-color: var(--accent);
      }

      .input::placeholder {
        color: var(--text-tertiary);
      }

      .file-list {
        margin-top: 12px;
        display: grid;
        gap: 4px;
      }

      .file-item {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        background: var(--surface);
      }

      .file-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
      }

      .file-head span:last-child {
        color: var(--text-tertiary);
        flex-shrink: 0;
      }

      .file-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .progress {
        width: 100%;
        height: 3px;
        background: var(--border);
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 120ms linear;
      }

      .summary {
        margin-top: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--text-tertiary);
      }

      .sessions-panel {
        padding: 16px;
        border-left: 1px solid var(--border);
        background: var(--surface);
        overflow-y: auto;
      }

      .sessions-panel h3 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .session-list {
        display: grid;
        gap: 2px;
      }

      .session-row {
        border-radius: var(--radius);
        padding: 10px;
        display: grid;
        gap: 4px;
        transition: background 80ms;
      }

      .session-row:hover {
        background: var(--surface-raised);
      }

      .session-main {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }

      .session-id {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .status {
        font-size: 11px;
        font-weight: 500;
        border-radius: var(--radius);
        padding: 2px 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .status.pending {
        color: var(--pending);
        background: rgba(229, 166, 59, 0.12);
      }

      .status.picked {
        color: var(--picked);
        background: rgba(63, 185, 80, 0.12);
      }

      .status.archived {
        color: var(--archived);
        background: rgba(110, 110, 115, 0.15);
      }

      .session-label {
        font-size: 13px;
        font-weight: 500;
      }

      .session-meta {
        display: flex;
        justify-content: space-between;
        color: var(--text-tertiary);
        font-size: 12px;
      }

      .session-actions {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        margin-top: 2px;
      }

      .session-actions .btn {
        font-size: 12px;
        padding: 3px 8px;
      }

      .confirm-card {
        margin-top: 12px;
        padding: 12px;
        border-radius: var(--radius);
        border: 1px solid rgba(63, 185, 80, 0.3);
        background: rgba(63, 185, 80, 0.06);
        display: none;
      }

      .confirm-card.active {
        display: block;
        animation: rise 150ms ease;
      }

      .confirm-card p {
        margin: 2px 0;
        font-size: 13px;
      }

      .confirm-card strong {
        color: var(--text-secondary);
        font-weight: 500;
      }

      .confirm-actions {
        margin-top: 8px;
        display: flex;
        gap: 6px;
      }

      .auth-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 10;
      }

      .auth-card {
        width: min(400px, calc(100% - 2rem));
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .auth-card h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }

      .auth-card p {
        margin: 0 0 16px;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      .hidden {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        font-size: 13px;
        color: var(--text-secondary);
        opacity: 0;
        transform: translateY(4px);
        transition: all 120ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sessions-panel {
          border-left: none;
          border-top: 1px solid var(--border);
        }

        .dropzone {
          min-height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <section id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <h2>Access token</h2>
        <p>Enter your Filegate API token to continue.</p>
        <form id="auth-form">
          <input
            id="auth-token"
            class="input"
            type="password"
            autocomplete="off"
            placeholder="sk_xxxxx"
            required
          />
          <label style="display: flex; gap: 6px; align-items: center; margin-top: 12px; color: var(--text-tertiary); font-size: 13px">
            <input id="auth-remember" type="checkbox" checked />
            Remember token
          </label>
          <div style="margin-top: 16px">
            <button class="btn primary" type="submit">Continue</button>
          </div>
        </form>
      </div>
    </section>

    <main id="app" class="app-shell hidden">
      <header class="topbar">
        <div class="brand">
          <h1>filegate</h1>
          <small>upload</small>
        </div>
        <div style="display: flex; gap: 6px">
          <button class="btn" id="refresh-sessions" type="button">Refresh</button>
          <button class="btn danger" id="logout" type="button">Logout</button>
        </div>
      </header>

      <section class="layout">
        <article class="upload-panel">
          <div id="dropzone" class="dropzone">
            <div>
              <h2>Drop files to create a session</h2>
              <p>Any file type accepted. Progress tracked in real time.</p>

              <div class="label-row">
                <input
                  id="session-label"
                  class="input"
                  type="text"
                  placeholder="Label (optional)"
                />
              </div>

              <div class="dropzone-actions">
                <button id="select-files" class="btn" type="button">Choose files</button>
                <button id="start-upload" class="btn primary" type="button">Upload</button>
                <input id="file-input" type="file" multiple accept="*/*" class="hidden" />
              </div>
            </div>

            <div>
              <div class="meta-line" id="selection-meta">0 files selected</div>
              <div class="progress" style="margin-top: 6px"><span id="global-progress"></span></div>
              <div class="summary" id="summary-text">Waiting for files...</div>
            </div>
          </div>

          <div class="file-list" id="file-list"></div>

          <div id="confirm-card" class="confirm-card">
            <p><strong>Session created</strong> <span id="confirm-session-id"></span></p>
            <p><strong>Files uploaded</strong> <span id="confirm-files"></span></p>
            <div class="confirm-actions">
              <button id="copy-session" type="button" class="btn">Copy ID</button>
              <button id="more-files" type="button" class="btn">New upload</button>
            </div>
          </div>
        </article>

        <aside class="sessions-panel">
          <h3>Sessions</h3>
          <div id="session-list" class="session-list"></div>
        </aside>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script>
      const STORAGE_TOKEN_KEY = 'filegate_ui_token';
      const SESSION_TOKEN_KEY = 'filegate_ui_session_token';
      const API_BASE = '/api';

      const state = {
        token: '',
        files: [],
        progressByFile: new Map(),
        progressIdByFile: new Map(),
        uploadSessionId: null,
      };

      const authScreen = document.getElementById('auth-screen');
      const authForm = document.getElementById('auth-form');
      const authToken = document.getElementById('auth-token');
      const authRemember = document.getElementById('auth-remember');
      const app = document.getElementById('app');
      const logoutButton = document.getElementById('logout');
      const refreshSessionsButton = document.getElementById('refresh-sessions');

      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const selectFilesButton = document.getElementById('select-files');
      const startUploadButton = document.getElementById('start-upload');
      const fileList = document.getElementById('file-list');
      const selectionMeta = document.getElementById('selection-meta');
      const sessionLabelInput = document.getElementById('session-label');
      const summaryText = document.getElementById('summary-text');
      const globalProgress = document.getElementById('global-progress');

      const sessionList = document.getElementById('session-list');
      const confirmCard = document.getElementById('confirm-card');
      const confirmSessionId = document.getElementById('confirm-session-id');
      const confirmFiles = document.getElementById('confirm-files');
      const copySessionButton = document.getElementById('copy-session');
      const moreFilesButton = document.getElementById('more-files');

      const toast = document.getElementById('toast');

      let refreshTimer = null;

      function showToast(text, error = false) {
        toast.textContent = text;
        toast.style.borderColor = error ? 'rgba(248, 81, 73, 0.4)' : 'var(--border)';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        const units = ['KB', 'MB', 'GB'];
        let value = bytes / 1024;
        let unit = units[0] || 'KB';
        for (let i = 1; i < units.length && value >= 1024; i += 1) {
          value /= 1024;
          unit = units[i] || unit;
        }
        return `${value.toFixed(1)} ${unit}`;
      }

      function toAuthMode(message) {
        state.token = '';
        localStorage.removeItem(STORAGE_TOKEN_KEY);
        sessionStorage.removeItem(SESSION_TOKEN_KEY);
        app.classList.add('hidden');
        authScreen.classList.remove('hidden');
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
        if (message) {
          showToast(message, true);
        }
      }

      function toAppMode(token, remember = false) {
        state.token = token;
        sessionStorage.setItem(SESSION_TOKEN_KEY, token);
        if (remember) {
          localStorage.setItem(STORAGE_TOKEN_KEY, token);
        } else {
          localStorage.removeItem(STORAGE_TOKEN_KEY);
        }
        authScreen.classList.add('hidden');
        app.classList.remove('hidden');
        refreshSessions();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(refreshSessions, 30_000);
      }

      function storedToken() {
        return sessionStorage.getItem(SESSION_TOKEN_KEY) || localStorage.getItem(STORAGE_TOKEN_KEY);
      }

      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (state.token) {
          headers.set('Authorization', `Bearer ${state.token}`);
        }

        const response = await fetch(`${API_BASE}${path}`, { ...options, headers });

        if (response.status === 401) {
          toAuthMode('Token invalid or expired.');
          throw new Error('Unauthorized');
        }

        if (!response.ok) {
          let message = `Request failed (${response.status})`;
          try {
            const payload = await response.json();
            if (payload && payload.error) {
              message = payload.error;
            }
          } catch {
            // no-op
          }
          throw new Error(message);
        }

        return response;
      }

      function setFiles(files) {
        state.files = Array.from(files);
        state.progressByFile.clear();
        state.progressIdByFile.clear();
        state.files.forEach((file, index) => {
          state.progressIdByFile.set(file, `progress-${index}`);
        });
        renderFiles();
      }

      function renderFiles() {
        fileList.innerHTML = '';

        if (state.files.length === 0) {
          selectionMeta.textContent = '0 files selected';
          summaryText.textContent = 'Waiting for files...';
          globalProgress.style.width = '0%';
          return;
        }

        const totalBytes = state.files.reduce((sum, file) => sum + file.size, 0);
        selectionMeta.textContent = `${state.files.length} files selected (${formatBytes(totalBytes)})`;

        for (const file of state.files) {
          const item = document.createElement('div');
          item.className = 'file-item';
          const head = document.createElement('div');
          head.className = 'file-head';

          const fileName = document.createElement('span');
          fileName.className = 'file-name';
          fileName.textContent = file.name;

          const fileSize = document.createElement('span');
          fileSize.textContent = formatBytes(file.size);

          const progressWrap = document.createElement('div');
          progressWrap.className = 'progress';
          const progressBar = document.createElement('span');
          progressBar.id = state.progressIdByFile.get(file);
          progressWrap.appendChild(progressBar);

          head.appendChild(fileName);
          head.appendChild(fileSize);
          item.appendChild(head);
          item.appendChild(progressWrap);
          fileList.appendChild(item);
        }
      }

      function updateGlobalProgress() {
        if (state.files.length === 0) {
          globalProgress.style.width = '0%';
          return;
        }

        const total = state.files.reduce((sum, file) => sum + file.size, 0);
        const loaded = state.files.reduce((sum, file) => {
          const value = state.progressByFile.get(file) || 0;
          return sum + Math.min(value, file.size);
        }, 0);

        const percent = total > 0 ? (loaded / total) * 100 : 0;
        globalProgress.style.width = `${percent.toFixed(1)}%`;
        summaryText.textContent = `${loaded > 0 ? 'Uploading' : 'Ready'} ${formatBytes(loaded)} / ${formatBytes(total)}`;
      }

      function setFileProgress(file, loaded) {
        state.progressByFile.set(file, loaded);
        const progressId = state.progressIdByFile.get(file);
        const element = progressId ? document.getElementById(progressId) : null;
        const percent = file.size > 0 ? (Math.min(loaded, file.size) / file.size) * 100 : 0;
        if (element) element.style.width = `${percent.toFixed(1)}%`;
        updateGlobalProgress();
      }

      function uploadFile(sessionId, file) {
        return new Promise((resolve, reject) => {
          const form = new FormData();
          form.append('files', file);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${API_BASE}/sessions/${encodeURIComponent(sessionId)}/files`, true);
          xhr.setRequestHeader('Authorization', `Bearer ${state.token}`);

          xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) {
              setFileProgress(file, event.loaded);
            }
          };

          xhr.onload = () => {
            if (xhr.status === 401) {
              toAuthMode('Token invalid or expired.');
              reject(new Error('Unauthorized'));
              return;
            }

            if (xhr.status >= 200 && xhr.status < 300) {
              setFileProgress(file, file.size);
              resolve();
              return;
            }

            let message = `Upload failed (${xhr.status})`;
            try {
              const body = JSON.parse(xhr.responseText);
              if (body && body.error) {
                message = body.error;
              }
            } catch {
              // no-op
            }
            reject(new Error(message));
          };

          xhr.onerror = () => reject(new Error('Network error while uploading.'));
          xhr.send(form);
        });
      }

      async function createSession(label) {
        const response = await api('/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label }),
        });

        return response.json();
      }

      async function startUpload() {
        if (state.files.length === 0) {
          showToast('Add files before uploading.', true);
          return;
        }

        startUploadButton.disabled = true;
        confirmCard.classList.remove('active');

        try {
          const label = sessionLabelInput.value.trim() || undefined;
          const session = await createSession(label);
          state.uploadSessionId = session.id;
          await Promise.all(state.files.map((file) => uploadFile(session.id, file)));

          confirmSessionId.textContent = session.id;
          const totalSize = state.files.reduce((sum, file) => sum + file.size, 0);
          confirmFiles.textContent = `${state.files.length} files (${formatBytes(totalSize)})`;
          confirmCard.classList.add('active');
          showToast(`Upload completed for ${session.id}`);

          await refreshSessions();
        } catch (error) {
          showToast(error instanceof Error ? error.message : String(error), true);
        } finally {
          startUploadButton.disabled = false;
        }
      }

      async function refreshSessions() {
        try {
          const response = await api('/sessions');
          const sessions = await response.json();
          renderSessions(sessions);
        } catch (error) {
          if (String(error) !== 'Error: Unauthorized') {
            showToast(error instanceof Error ? error.message : String(error), true);
          }
        }
      }

      function renderSessions(sessions) {
        sessionList.innerHTML = '';

        if (!Array.isArray(sessions) || sessions.length === 0) {
          sessionList.innerHTML = '<p class="meta-line">No sessions yet.</p>';
          return;
        }

        for (const session of sessions) {
          const row = document.createElement('article');
          row.className = 'session-row';

          const sessionMain = document.createElement('div');
          sessionMain.className = 'session-main';
          const left = document.createElement('div');

          const idElement = document.createElement('div');
          idElement.className = 'session-id';
          idElement.textContent = String(session.id || '');

          const labelElement = document.createElement('div');
          labelElement.className = 'session-label';
          labelElement.textContent = String(session.label || 'Unlabeled');

          const status = document.createElement('span');
          status.className = `status ${String(session.status || '')}`;
          status.textContent = String(session.status || 'unknown');

          left.appendChild(idElement);
          left.appendChild(labelElement);
          sessionMain.appendChild(left);
          sessionMain.appendChild(status);

          const meta = document.createElement('div');
          meta.className = 'session-meta';

          const filesCount = document.createElement('span');
          const files = Array.isArray(session.files) ? session.files.length : 0;
          filesCount.textContent = `${files} files`;

          const created = document.createElement('span');
          created.textContent = String(session.created || '').slice(0, 19).replace('T', ' ');

          meta.appendChild(filesCount);
          meta.appendChild(created);

          const actions = document.createElement('div');
          actions.className = 'session-actions';

          const copyButton = document.createElement('button');
          copyButton.className = 'btn';
          copyButton.type = 'button';
          copyButton.textContent = 'Copy ID';
          copyButton.addEventListener('click', async () => {
            const id = String(session.id || '');
            if (!id) return;
            await navigator.clipboard.writeText(id);
            showToast(`Copied ${id}`);
          });

          actions.appendChild(copyButton);
          row.appendChild(sessionMain);
          row.appendChild(meta);
          row.appendChild(actions);
          sessionList.appendChild(row);
        }
      }

      function registerDropzone() {
        ['dragenter', 'dragover'].forEach((eventName) => {
          dropzone.addEventListener(eventName, (event) => {
            event.preventDefault();
            dropzone.classList.add('active');
          });
        });

        ['dragleave', 'drop'].forEach((eventName) => {
          dropzone.addEventListener(eventName, (event) => {
            event.preventDefault();
            if (eventName === 'drop') {
              const files = event.dataTransfer?.files || [];
              setFiles(files);
            }
            dropzone.classList.remove('active');
          });
        });
      }

      authForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const token = authToken.value.trim();
        if (!token) {
          showToast('Token is required.', true);
          return;
        }
        toAppMode(token, Boolean(authRemember.checked));
        authToken.value = '';
      });

      logoutButton.addEventListener('click', () => toAuthMode());
      refreshSessionsButton.addEventListener('click', refreshSessions);

      selectFilesButton.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (event) => {
        const files = event.target.files || [];
        setFiles(files);
      });
      startUploadButton.addEventListener('click', startUpload);

      copySessionButton.addEventListener('click', async () => {
        if (!state.uploadSessionId) return;
        await navigator.clipboard.writeText(state.uploadSessionId);
        showToast(`Copied ${state.uploadSessionId}`);
      });

      moreFilesButton.addEventListener('click', () => {
        state.uploadSessionId = null;
        confirmCard.classList.remove('active');
        setFiles([]);
        fileInput.value = '';
        sessionLabelInput.value = '';
      });

      registerDropzone();

      const token = storedToken();
      if (token) {
        const rememberedToken = localStorage.getItem(STORAGE_TOKEN_KEY);
        toAppMode(token, Boolean(rememberedToken));
      } else {
        toAuthMode();
      }
    </script>
  </body>
</html>
